<!DOCTYPE html>
<html>
<head>
    <title>3.Tabla</title>
</head>
<body bgcolor="blue" text="yellow">

    <h1 align="left">3.Tabla</h1>
    <hr color="yellow" size="2">
    <br>

    <table border="3" bordercolor="yellow" bgcolor="blue" align="center" cellpadding="12" cellspacing="4" width="80%">
        <tr align="center">
            <td rowspan="4" bgcolor="lightblue" width="15%"><b>1</b></td>
            <td colspan="4" bgcolor="green"><b>2</b></td>
            <td rowspan="4" bgcolor="lightblue" width="15%"><b>3</b></td>
        </tr>
        <tr align="center">
            <td colspan="1" bgcolor="green" width="17%"><b>4</b></td>
            <td colspan="3" bgcolor="lightblue"><b>5</b></td>
        </tr>
        <tr align="center">
            <td rowspan="2" bgcolor="green"><b>6</b></td>
            <td colspan="3" bgcolor="lightblue"><b>7</b></td>
        </tr>
        <tr align="center">
            <td bgcolor="lightblue" width="17%"><b>9</b></td>
            <td bgcolor="green" width="17%"><b>10</b></td>
            <td bgcolor="lightblue" width="17%"><b>11</b></td>
        </tr>
        <tr align="center">
            <td rowspan="4" bgcolor="green"><b>12</b></td>
            <td colspan="3" bgcolor="lightblue"><b>13</b></td>
            <td bgcolor="green"><b>14</b></td>
            <td rowspan="4" bgcolor="lightblue"><b>15</b></td>
        </tr>
        <tr align="center">
            <td colspan="3" bgcolor="green"><b>16</b></td>
            <td bgcolor="lightblue"><b>17</b></td>
        </tr>
        <tr align="center">
            <td bgcolor="green"><b>18</b></td>
            <td colspan="3" bgcolor="lightblue"><b>19</b></td>
        </tr>
        <tr align="center">
            <td colspan="4" bgcolor="green"><b>20</b></td>
        </tr>
    </table>

</body>
</html>
